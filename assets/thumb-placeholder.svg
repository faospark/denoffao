<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Preview unavailable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3154"/>
      <stop offset="55%" stop-color="#111d34"/>
      <stop offset="100%" stop-color="#070e1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93c5fd" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Base RPG Navy Backdrop -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- Subtle Inner Frame -->
  <rect x="18" y="18" width="604" height="324" rx="8" fill="none" stroke="url(#frame)" stroke-width="1.5"/>
  <rect x="24" y="24" width="592" height="312" rx="5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Corner Accents -->
  <g stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 30 44 L 30 30 L 44 30"/>
    <path d="M 596 30 L 610 30 L 610 44"/>
    <path d="M 30 316 L 30 330 L 44 330"/>
    <path d="M 596 330 L 610 330 L 610 316"/>
  </g>

  <!-- Center Emblem Badge -->
  <circle cx="320" cy="148" r="46" fill="#0b1528" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.75"/>
  <circle cx="320" cy="148" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Image Frame / Landscape Icon -->
  <g transform="translate(296 124)" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="42" height="34" rx="4" fill="#172847" fill-opacity="0.7"/>
    <circle cx="15.5" cy="16.5" r="3.5" fill="#fbbf24" stroke="none"/>
    <path d="M 6 33 L 18 21 L 27 30 L 33 24 L 42 33"/>
  </g>

  <!-- Caption -->
  <text x="320" y="226" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4">DEN OF FAO</text>
  <text x="320" y="250" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1.4">PREVIEW IMAGE UNAVAILABLE</text>
</svg>
